<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Homy Property — Sedang offline</title>
<meta name="theme-color" content="#0b3d2e">
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: #f7f3ec; color: #1c1c1c;
    font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    padding: 24px; text-align: center;
  }
  .card { max-width: 420px; width: 100%; background: #fff; border: 1px solid #e8dfd3; border-radius: 20px; padding: 32px 24px; }
  img { width: 72px; height: 72px; border-radius: 16px; }
  h1 { margin: 18px 0 8px; font-size: 22px; color: #0b3d2e; }
  p { margin: 0 0 20px; color: #65706c; line-height: 1.6; font-size: 15px; }
  a.btn { display: inline-block; background: #0b3d2e; color: #fff; text-decoration: none; font-weight: 600; padding: 13px 22px; border-radius: 999px; font-size: 15px; }
  small { display: block; margin-top: 18px; color: #a18a61; font-size: 12px; }
</style>
</head>
<body>
  <main class="card">
    <img src="/icon-192.png" alt="Homy Property" width="72" height="72">
    <h1>Anda sedang offline</h1>
    <p>Koneksi internet tidak terdeteksi. Periksa jaringan Anda, lalu coba muat ulang halaman properti.</p>
    <a class="btn" href="/">Muat ulang Homy Property</a>
    <small>Homy Property — Temukan hunian terbaik</small>
  </main>
  <script>window.addEventListener('online', function () { location.replace('/') })</script>
</body>
</html>
