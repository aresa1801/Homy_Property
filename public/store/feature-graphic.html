<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1024px; height: 500px; overflow: hidden; }
  body {
    font-family: 'DejaVu Sans', 'Liberation Sans', Arial, sans-serif;
    background: radial-gradient(120% 140% at 88% 8%, #17543f 0%, #0b3d2e 45%, #072a1f 100%);
    color: #f7f3ec;
    position: relative;
    display: flex;
    align-items: center;
  }
  .glow {
    position: absolute; inset: auto -140px -220px auto;
    width: 620px; height: 620px; border-radius: 50%;
    background: radial-gradient(circle, rgba(201,169,97,.30) 0%, rgba(201,169,97,0) 68%);
  }
  .glow2 {
    position: absolute; top: -180px; left: -120px;
    width: 460px; height: 460px; border-radius: 50%;
    background: radial-gradient(circle, rgba(78,134,109,.45) 0%, rgba(78,134,109,0) 70%);
  }
  .grid {
    position: absolute; inset: 0;
    background-image: linear-gradient(rgba(255,255,255,.045) 1px, transparent 1px),
                      linear-gradient(90deg, rgba(255,255,255,.045) 1px, transparent 1px);
    background-size: 64px 64px;
    mask-image: radial-gradient(120% 120% at 30% 40%, #000 35%, transparent 80%);
  }
  .wrap { position: relative; padding: 0 68px; width: 100%; }
  .brand { display: flex; align-items: center; gap: 18px; margin-bottom: 26px; }
  .brand img { height: 74px; width: auto; display: block; }
  h1 { font-size: 44px; line-height: 1.08; letter-spacing: -.5px; font-weight: 800; max-width: 620px; }
  h1 em { font-style: normal; color: #e3c887; }
  p.sub { margin-top: 18px; font-size: 20px; line-height: 1.5; color: #d8e2dc; max-width: 600px; }
  .row { margin-top: 30px; display: flex; align-items: center; gap: 14px; }
  .pill {
    display: inline-flex; align-items: center; gap: 8px;
    border: 1px solid rgba(227,200,135,.55); border-radius: 999px;
    padding: 10px 18px; font-size: 17px; font-weight: 600; color: #f0e6cf;
    background: rgba(255,255,255,.05);
  }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #7bd0a4; box-shadow: 0 0 12px #7bd0a4; }
  .url { font-size: 17px; font-weight: 700; color: #cfe3d8; letter-spacing: .3px; }
  .house { position: absolute; right: 62px; top: 50%; transform: translateY(-50%); opacity: .95; }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="glow"></div>
  <div class="glow2"></div>
  <svg class="house" width="250" height="250" viewBox="0 0 24 24" fill="none" stroke="#e3c887" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round" style="opacity:.5">
    <path d="M3 10.5 12 3l9 7.5" />
    <path d="M5 9.8V20a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V9.8" />
    <path d="M9.5 21v-5.5a1 1 0 0 1 1-1h3a1 1 0 0 1 1 1V21" />
  </svg>
  <div class="wrap">
    <div class="brand">
      <img src="logo-homy-light.png" alt="Homy Property" />
    </div>
    <h1>Cari, jual &amp; sewa properti <em>tanpa ribet</em></h1>
    <p class="sub">Listing terverifikasi, harga transparan, dan asisten AI yang membantu Anda menemukan hunian yang tepat.</p>
    <div class="row">
      <span class="pill"><span class="dot"></span> Pemilik &amp; agen terverifikasi</span>
      <span class="url">homyproperty.id</span>
    </div>
  </div>
</body>
</html>
